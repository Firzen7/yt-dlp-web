# Configuration is read at startup. Restart the application after changing values.
# Relative paths are resolved from the application's working directory.

# TCP port on which the embedded HTTP server listens.
server.port=8080

# Parent directory for downloaded files, with a separate subdirectory for each task.
fs.download_directory=/tmp/yt-dlp-web

# Directory for per-user action logs. Must already exist and be writable.
fs.log_directory=/opt/yt-dlp-web/logs

# Directory for per-user session files, created automatically when needed.
fs.session_directory=./sessions

# JavaScript runtime name passed to yt-dlp for extracting media information.
fs.js_runtime_type=node

# Path to the executable for the JavaScript runtime selected above.
fs.js_runtime_path=/usr/bin/node

# File containing usernames and salted password hashes, shared by the CLI and Web UI.
auth.users_file=./users.conf

# Login session lifetime in seconds, measured from creation (2592000 = 30 days).
auth.login_session_length=2592000

# Minimum estimated password entropy in bits for Web UI password changes.
# Must be a positive integer; larger values require stronger passwords.
auth.minimum_password_entropy=32

# Child-process timeout in seconds (1200 = 20 minutes).
# Also used for the ffmpeg network timeout.
process.timeout=1200
