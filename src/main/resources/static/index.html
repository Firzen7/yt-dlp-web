<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahovač Videa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>
    <div class="background-effects">
        <div class="glow-orb purple"></div>
        <div class="glow-orb blue"></div>
    </div>

    <header class="navbar">
        <div class="logo">
        </div>
        <div class="user-actions" style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px;">
            <div id="logged-in-user" style="color: var(--text-muted); font-size: 0.85rem;"></div>
            <a href="#" id="logout-btn">Odhlásit se <i class="fa-solid fa-arrow-right-from-bracket"
                    style="margin-left: 5px;"></i></a>
        </div>
    </header>

    <main class="container">
        <div class="glass-card neon-border">
            <h1 class="title neon-text">Stahovač Videa</h1>

            <form id="download-form" class="content-wrapper">
                <div class="input-group">
                    <input type="url" id="video-url" placeholder="Stiskni CTRL+V pro vložení odkazu videa..."
                        required />
                    <button type="button" class="settings-btn" id="edit-filename-btn" title="Upravit název videa">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <div class="filename-group hidden" id="filename-group">
                    <input type="text" id="custom-filename" placeholder="Vlastní název videa..." />
                    <button type="button" class="clear-filename-btn hidden" id="clear-filename-btn" title="Vymazat název">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="filename-loader hidden" id="filename-loader">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Načítám název...
                    </div>
                </div>

                <div class="toggle-container">
                    <span class="toggle-label video-label glow-text">VIDEO</span>
                    <label class="switch">
                        <input type="checkbox" id="format-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label mp3-label">AUDIO</span>
                </div>

                <div class="action-container">
                    <button type="submit" id="submit-btn" class="btn-primary">
                        <span class="btn-text">ZAČÍT STAHOVAT</span> <i class="fa-solid fa-download"></i>
                    </button>
                    <div id="status-message" class="status-message hidden">
                        <div class="progress-bar-bg" id="progress-bar-bg"
                            style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0, 195, 255, 0.2); width: 0%; border-radius: 12px; transition: width 0.3s; z-index: 1;">
                        </div>
                        <i class="fa-solid fa-circle-notch fa-spin" style="z-index: 2;"></i> <span id="status-text"
                            style="z-index: 2;">Zpracovávám...</span>
                    </div>

                    <div id="error-message" class="error-message hidden">
                        Něco se pokazilo. Zkuste to prosím znovu.
                    </div>
                </div>
            </form>
        </div>
    </main>

    <div id="app-version" class="version-info"></div>

    <script src="/script.js"></script>
</body>

</html>
