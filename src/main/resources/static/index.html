<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahovač Videa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-effects">
        <div class="glow-orb purple"></div>
        <div class="glow-orb blue"></div>
    </div>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-circle-down"></i> STAHUJ
        </div>
        <div class="user-actions">
            <a href="#" id="logout-btn">Odhlásit se <i class="fa-solid fa-arrow-right-from-bracket"
                    style="margin-left: 5px;"></i></a>
        </div>
    </header>

    <main class="container">
        <div class="glass-card neon-border">
            <h1 class="title neon-text">Stahovač Videa</h1>

            <form id="download-form" class="content-wrapper">
                <div class="input-group">
                    <input type="url" id="video-url" placeholder="Vložte URL videa..." required />
                    <button type="button" class="paste-btn" id="paste-btn" title="Vložit"><i
                            class="fa-regular fa-clipboard"></i></button>
                    <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                </div>

                <div class="toggle-container">
                    <span class="toggle-label video-label glow-text">VIDEO</span>
                    <label class="switch">
                        <input type="checkbox" id="format-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label mp3-label">MP3</span>
                </div>

                <div class="action-container">
                    <button type="submit" id="submit-btn" class="btn-primary">
                        <span class="btn-text">STÁHNOUT NYNÍ</span> <i class="fa-solid fa-download"></i>
                    </button>
                    <div id="status-message" class="status-message hidden">
                        <div class="progress-bar-bg" id="progress-bar-bg"
                            style="position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0, 195, 255, 0.2); width: 0%; border-radius: 12px; transition: width 0.3s; z-index: 1;">
                        </div>
                        <i class="fa-solid fa-circle-notch fa-spin" style="z-index: 2;"></i> <span id="status-text"
                            style="z-index: 2;">Zpracovávám...</span>
                    </div>
                    <a id="download-link" class="btn-success hidden" href="#" download>
                        ULOŽIT SOUBOR <i class="fa-solid fa-check"></i>
                    </a>
                    <div id="error-message" class="error-message hidden">
                        Něco se pokazilo. Zkuste to prosím znovu.
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="/script.js"></script>
</body>

</html>
